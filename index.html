<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020611"><title>NEURAL ACCESS // Demo</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020611;color:#d5faff;font-family:system-ui,-apple-system,sans-serif}body{overflow:hidden}.scene{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 44%,#10324b 0%,#061323 35%,#020611 75%)}.stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 13% 23%,#b9faff 99%,transparent),radial-gradient(1px 1px at 78% 19%,#b9faff 99%,transparent),radial-gradient(2px 2px at 45% 68%,#64ddff 99%,transparent),radial-gradient(1px 1px at 83% 81%,#b9faff 99%,transparent);background-size:170px 210px;opacity:.45;animation:stars 18s linear infinite}.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 5px,#7ae9ff08 6px 7px);pointer-events:none}.top{position:absolute;top:max(24px,env(safe-area-inset-top));left:22px;right:22px;display:flex;justify-content:space-between;gap:12px;font:10px ui-monospace,monospace;letter-spacing:2px;color:#78b8c9}.top span:last-child{text-align:right}.stage{position:absolute;left:50%;top:44%;width:min(75vw,340px);aspect-ratio:1;transform:translate(-50%,-50%);display:grid;place-items:center;filter:drop-shadow(0 0 18px #24ceff55)}.ring{position:absolute;border-radius:50%;border:1px solid #63e7ff66;box-shadow:inset 0 0 20px #2ad4ff22,0 0 18px #2ad4ff22}.outer{inset:0;border-top:3px solid #c5fbff;border-bottom:3px solid #c5fbff;animation:spin 4s linear infinite}.middle{inset:12%;border:2px dashed #78eaffaa;animation:spin 8s linear infinite reverse}.inner{inset:26%;border-left:4px solid #c5fbff;border-right:4px solid #c5fbff;animation:spin 2s linear infinite}.ticks{position:absolute;inset:-8%;border-radius:50%;background:repeating-conic-gradient(#77eaff77 0deg 1deg,transparent 1deg 12deg);mask:radial-gradient(transparent 67%,#000 68% 69%,transparent 70%);animation:spin 24s linear infinite}.core{width:25%;aspect-ratio:1;border:1px solid #b5f7ff;border-radius:50%;display:grid;place-items:center;font-size:clamp(25px,8vw,43px);background:radial-gradient(circle,#8cefff44,transparent 70%);box-shadow:0 0 35px #5ceaff88;animation:pulse 2s ease-in-out infinite}.status{position:absolute;left:14px;right:14px;top:72%;text-align:center;font:900 clamp(19px,5.5vw,32px) ui-monospace,monospace;letter-spacing:clamp(1px,.8vw,4px);text-shadow:0 0 20px currentColor;min-height:40px}.sub{position:absolute;top:80%;left:15px;right:15px;text-align:center;font:10px ui-monospace,monospace;letter-spacing:2px;color:#8cbbcd;line-height:1.7}.progress{position:absolute;top:87%;left:12%;width:76%;height:3px;background:#194252;overflow:hidden}.progress>div{height:100%;width:0;background:#c3fbff;box-shadow:0 0 15px #7deaff;transition:width .2s}.controls{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:14px;right:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{appearance:none;border:1px solid #4bcce5;background:#092d3c;color:#c4faff;padding:12px 14px;border-radius:12px;font-weight:800;font-size:12px;min-height:44px;touch-action:manipulation}button.error-btn{border-color:#d94a69;background:#38101d;color:#ffb0c0}button.reset{border-color:#455765;background:#101b29;color:#b8c6d3}.flash{position:absolute;inset:0;opacity:0;background:#e1ffff;pointer-events:none}.scene.success .stage{animation:burst 1s ease-in forwards}.scene.success .flash{animation:flash 1s ease-out}.scene.error .ring,.scene.error .core{border-color:#ff3f69;box-shadow:0 0 26px #ff3f6980}.scene.error .stage{animation:shake .38s linear 2}.scene.error .status{color:#ff466c}.scene.error .progress>div{background:#ff466c}.scene.error .flash{background:#ff3355;animation:flash .5s ease-out}.scene.error{background:radial-gradient(ellipse at 50% 44%,#3a1021,#08030c 72%)}.scene.success .status{color:#a8ffed}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.12);filter:brightness(1.7)}}@keyframes stars{to{background-position:170px 210px}}@keyframes burst{45%{transform:translate(-50%,-50%) scale(1.3);filter:brightness(2.5)}100%{transform:translate(-50%,-50%) scale(3);opacity:0}}@keyframes flash{0%,20%{opacity:0}45%{opacity:.8}100%{opacity:0}}@keyframes shake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 8px),-50%)}75%{transform:translate(calc(-50% + 8px),-50%)}}@media(max-height:620px){.stage{width:min(45vh,230px);top:39%}.status{top:67%}.sub{top:76%}.progress{top:83%}}@media(prefers-reduced-motion:reduce){.stars,.ring,.ticks,.core{animation-duration:30s}}
</style></head><body><main class="scene" id="scene"><div class="stars"></div><div class="scan"></div><div class="top"><span>NEURAL ACCESS<br>PROTOCOL // 001</span><span id="clock">SYSTEM ONLINE</span></div><div class="stage"><div class="ticks"></div><div class="ring outer"></div><div class="ring middle"></div><div class="ring inner"></div><div class="core">◇</div></div><div class="flash"></div><div class="status" id="status" aria-live="polite">SYSTEM READY</div><div class="sub" id="sub">AWAITING AUTHENTICATION</div><div class="progress"><div id="bar"></div></div><div class="controls"><button id="success">▶ ACCESS ACCEPTED</button><button class="error-btn" id="error">▶ ERROR</button><button class="reset" id="reset">↻ RESET</button></div></main><script>
(()=>{'use strict';const scene=document.getElementById('scene'),status=document.getElementById('status'),sub=document.getElementById('sub'),bar=document.getElementById('bar');let timers=[];function later(fn,ms){timers.push(setTimeout(fn,ms))}function reset(){timers.forEach(clearTimeout);timers=[];scene.classList.remove('success','error');void scene.offsetWidth;status.textContent='SYSTEM READY';sub.textContent='AWAITING AUTHENTICATION';bar.style.width='0%'}function run(fail){reset();status.textContent='AUTHENTICATING';sub.textContent='INITIALIZING NEURAL LINK';const steps=[[12,'ESTABLISHING CONNECTION'],[33,'VERIFYING CREDENTIALS'],[57,'SCANNING ACCESS LEVEL'],[81,'FINALIZING AUTHENTICATION'],[100,'VERIFICATION COMPLETE']];steps.forEach(([n,text],i)=>later(()=>{bar.style.width=n+'%';sub.textContent=text},i*280+150));later(()=>{if(fail){scene.classList.add('error');status.textContent='ERROR';sub.textContent='ACCESS DENIED / AUTHENTICATION FAILED'}else{scene.classList.add('success');status.textContent='ACCESS ACCEPTED';sub.textContent='LINK ESTABLISHED / WELCOME ADMINISTRATOR'}},1750);if(!fail)later(()=>{scene.classList.remove('success');status.textContent='LINK ESTABLISHED';sub.textContent='WELCOME, ADMINISTRATOR'},2900)}document.getElementById('success').addEventListener('click',()=>run(false));document.getElementById('error').addEventListener('click',()=>run(true));document.getElementById('reset').addEventListener('click',reset);})();
</script></body></html>
